---
name: EBaC (Electronic Bible and Concordance)
# The app version. Bump it whenever anything in the app changes (including
# EBAC_COMMIT in the Dockerfile), so Home Assistant offers the update to
# people who have it installed.
version: "2.8.1"
slug: ebac
description: Bible reader and concordance, in a terminal in the sidebar
url: https://github.com/neilbrookins/ebac-ha-app
arch:
  - aarch64
  - amd64
# The base image's s6-overlay is the init system.
init: false
startup: application
boot: auto
# Show EBaC inside Home Assistant, with its own sidebar button,
# for every user (not only administrators).
ingress: true
ingress_port: 8099
panel_icon: mdi:book-cross
panel_title: EBaC
panel_admin: false
# Voice: ebac-api answers the EBaC integration (ebac-ha-integration) on
# port 8080 of Home Assistant's internal network only (the port isn't
# published to the host), and the app tells Home Assistant it is there.
discovery:
  - ebac
# Troubleshooting: show what EBaC's page sees of the focus and the window's
# size, in a box in its top right corner (see gestures.js).
# Voice: whether ebac-admin (beside ebac-api) may add or remove
# translations for the integration's voice commands. Off unless checked:
# anything on Home Assistant's internal network can ask it.
options:
  debug_overlay: false
  allow_add: false
  allow_remove: false
schema:
  debug_overlay: bool
  allow_add: bool
  allow_remove: bool
